# Publie CISPOLstore Manager (racine du site), WiFi Zone Manager (/wifizone/) et NZIMBU (/nzimbu/) sur GitHub Pages.
name: Publier CISPOLstore et WiFi Zone
on:
  push:
    branches: [main]
    paths: ['cispolstore/**', 'wifizone/**', 'nzimbu/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assembler le site
        run: |
          mkdir _site
          cp -r cispolstore/. _site/
          cp -r wifizone _site/wifizone
          cp -r nzimbu _site/nzimbu
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
