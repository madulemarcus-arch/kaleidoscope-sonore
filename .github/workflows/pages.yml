# Publie CISPOLstore Manager (racine du site), WiFi Zone Manager (/wifizone/), NZIMBU (/nzimbu/) et CISPOLstore Business (/business/) sur GitHub Pages.
name: Publier CISPOLstore et WiFi Zone
on:
  push:
    branches: [main]
    paths: ['cispolstore/**', 'wifizone/**', 'nzimbu/**', 'business/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # Deux jobs distincts : le paquet du site est envoyé dans « build », puis « deploy » le retrouve quelques secondes plus tard
  # (publier dans le même job échouait souvent : « No artifacts named github-pages were found »).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assembler le site
        run: |
          mkdir _site
          cp -r cispolstore/. _site/
          cp -r wifizone _site/wifizone
          cp -r nzimbu _site/nzimbu
          cp -r business _site/business
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Laisser à GitHub le temps d'enregistrer le paquet
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
