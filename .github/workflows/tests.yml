# Lance les tests automatiques de CISPOLstore Manager (contrôles statiques + parcours dans Chromium) à chaque modification.
name: Tests CISPOLstore
on:
  push:
    branches: [main]
    paths: ['cispolstore/**', 'tests/**', '.github/workflows/tests.yml']
  pull_request:
    paths: ['cispolstore/**', 'tests/**', '.github/workflows/tests.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Installer Playwright et Chromium
        working-directory: tests
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Lancer les tests
        working-directory: tests
        run: node run.js
