<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caisse WiFi Zone</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--txt:#1b1f24;--mut:#6b7280;--line:#e5e7eb;--ok:#16a34a}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--txt:#f1f2f4;--mut:#9aa1ad;--line:#2a2f38}}
*{box-sizing:border-box}
body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--txt);padding:12px;max-width:560px;margin:auto}
h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.total{font-size:30px;font-weight:700}
.mut{color:var(--mut);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fo{border:0;border-radius:12px;padding:18px 8px;color:#fff;font-size:16px;font-weight:600;cursor:pointer}
.fo small{display:block;font-weight:400;opacity:.9;margin-top:4px}
.fo.sel{outline:4px solid var(--txt)}
input,select{width:100%;padding:12px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--txt);margin-top:8px}
button.main{width:100%;margin-top:10px;padding:16px;font-size:18px;font-weight:700;border:0;border-radius:12px;background:var(--ok);color:#fff;cursor:pointer}
button.sec{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--txt);cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{flex:1}
.tabs button[aria-pressed=true]{background:var(--txt);color:var(--bg)}
#msg{min-height:20px;margin-top:8px;font-weight:600}
#lock{position:fixed;inset:0;background:var(--bg);z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#lock[hidden]{display:none}
#lock input{max-width:240px;text-align:center;font-size:28px;letter-spacing:8px}
#lock button.main{max-width:240px}
#lockMsg{min-height:22px;margin-top:10px;font-weight:600;color:#dc2626}
</style>
</head>
<body>
<div id="lock" hidden>
  <h1>Caisse WiFi Zone</h1>
  <p id="lockTitre"></p>
  <input id="pin1" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="PIN">
  <input id="pin2" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="Répétez le PIN" hidden>
  <button class="main" id="lockOk">OK</button>
  <button class="sec" id="lockAnnuler" style="margin-top:10px">Annuler</button>
  <div id="lockMsg"></div>
</div>
<h1>Caisse WiFi Zone</h1>
<button class="sec" id="ouvrirGerant" style="float:right;margin-top:-40px">🔒 Espace gérant</button>

<div class="card">
  <div class="grid" id="forfaits"></div>
  <input id="code" placeholder="Code du ticket (facultatif)" autocapitalize="characters" autocomplete="off">
  <input id="client" placeholder="Nom du client (facultatif)" autocomplete="off">
  <button class="main" id="vendre">Encaisser maintenant</button>
  <button class="main" id="facture" style="background:#ea580c">Facture en attente (pas encore payé)</button>
  <div id="msg"></div>
</div>

<div class="card" id="carteAttente" hidden>
  <b>Factures en attente de paiement</b>
  <div class="mut">Pas comptées dans les ventes tant que le client n'a pas payé.</div>
  <div id="attente"></div>
</div>

<div id="gerant" hidden>
<div class="card">
  <div class="mut" id="jourLib">Aujourd'hui</div>
  <div class="total" id="totalJour">0 FC</div>
  <div class="mut" id="nbJour">0 vente</div>
</div>

<div class="card">
  <div class="tabs" id="tabs">
    <button class="sec" data-p="jour" aria-pressed="true">Jour</button>
    <button class="sec" data-p="semaine" aria-pressed="false">Semaine</button>
    <button class="sec" data-p="mois" aria-pressed="false">Mois</button>
  </div>
  <div class="mut" id="resume"></div>
  <div id="liste"></div>
</div>

<div class="card">
  <b>Factures abandonnées</b>
  <div class="mut" id="abResume"></div>
  <div id="abandons"></div>
</div>

<div class="card">
  <b>Prix des forfaits</b>
  <div id="prix"></div>
  <button class="sec" id="exporter" style="margin-top:10px">Exporter en CSV (Excel)</button>
  <button class="sec" id="sauver" style="margin-top:10px">Sauvegarder</button>
  <button class="sec" id="restaurer" style="margin-top:10px">Restaurer</button>
  <input type="file" id="fichier" accept=".json" hidden>
  <button class="sec" id="changerPin" style="margin-top:10px">Changer le PIN</button>
  <button class="sec" id="verrouiller" style="margin-top:10px">Verrouiller</button>
</div>

</div>

<script>
(() => {
  // Plans with default prices; prices can be edited and are saved in localStorage
  const FORFAITS = [
    { id: 'V', nom: 'Visiteur', duree: '6 heures', prix: 500, c: '#16a34a' },
    { id: 'J', nom: 'Jour', duree: '24 heures', prix: 1000, c: '#2563eb' },
    { id: 'S', nom: 'Semaine', duree: '7 jours', prix: 7000, c: '#ea580c' },
    { id: 'M', nom: 'Mois', duree: '30 jours', prix: 30000, c: '#7c3aed' },
  ];
  const $ = id => document.getElementById(id);
  const CLE = 'caisse-simple-v1';
  let data = { prix: {}, ventes: [], attente: [], abandons: [], num: 0 };
  try { data = { ...data, ...JSON.parse(localStorage.getItem(CLE) || '{}') }; } catch (e) {}
  let choix = null, periode = 'jour';

  const save = () => { try { localStorage.setItem(CLE, JSON.stringify(data)); } catch (e) { msg('Stockage impossible : sauvegardez vos données.', true); } };
  const prixDe = f => data.prix[f.id] != null ? data.prix[f.id] : f.prix;
  const fc = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' FC';
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function msg(t, err) { const m = $('msg'); m.textContent = t; m.style.color = err ? '#dc2626' : 'var(--ok)'; }
  function debut(p) {
    const d = new Date(); d.setHours(0, 0, 0, 0);
    if (p === 'semaine') d.setDate(d.getDate() - 6);
    if (p === 'mois') d.setDate(1);
    return d.getTime();
  }
  const depuis = p => data.ventes.filter(v => v.t >= debut(p)).sort((a, b) => b.t - a.t);

  function dessiner() {
    $('forfaits').innerHTML = FORFAITS.map(f =>
      `<button class="fo${choix === f.id ? ' sel' : ''}" data-id="${f.id}" style="background:${f.c}">${f.nom}<small>${f.duree} · ${fc(prixDe(f))}</small></button>`).join('');
    const jour = depuis('jour');
    $('totalJour').textContent = fc(jour.reduce((s, v) => s + v.prix, 0));
    $('nbJour').textContent = jour.length + (jour.length > 1 ? ' ventes' : ' vente');
    const l = depuis(periode);
    $('resume').textContent = l.length + ' vente(s) · ' + fc(l.reduce((s, v) => s + v.prix, 0));
    $('liste').innerHTML = l.slice(0, 100).map(v => {
      const f = FORFAITS.find(x => x.id === v.f);
      const h = new Date(v.t).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
      return `<div class="row"><div><b>${f ? f.nom : v.f}</b> ${v.fac ? 'F-' + String(v.fac).padStart(4, '0') + ' ' : ''}${esc(v.code || '')}<div class="mut">${h}${v.client ? ' · ' + esc(v.client) : ''}</div></div><div>${fc(v.prix)} <button class="sec" data-del="${v.t}">✕</button></div></div>`;
    }).join('') || '<div class="mut">Aucune vente.</div>';
    const num = n => 'F-' + String(n).padStart(4, '0');
    const ago = t => { const m = Math.max(0, Math.round((Date.now() - t) / 60000)); return m < 60 ? m + ' min' : m < 1440 ? Math.floor(m / 60) + ' h' : Math.floor(m / 1440) + ' j'; };
    $('carteAttente').hidden = !data.attente.length;
    $('attente').innerHTML = data.attente.map(e => {
      const f = FORFAITS.find(x => x.id === e.f);
      return `<div class="row"><div><b>${num(e.n)}</b> ${f ? f.nom : e.f} ${esc(e.code || '')}<div class="mut">${fc(e.prix)} · il y a ${ago(e.t)}${e.client ? ' · ' + esc(e.client) : ''}</div></div><div><button class="sec" data-enc="${e.id}">Encaisser</button> <button class="sec" data-imp="${e.id}">🖨</button> <button class="sec" data-abd="${e.id}">✕</button></div></div>`;
    }).join('');
    const ab = data.abandons.slice().reverse();
    $('abResume').textContent = ab.length + ' abandonnée(s) · ' + fc(ab.reduce((s, e) => s + e.prix, 0)) + ' non encaissés';
    $('abandons').innerHTML = ab.slice(0, 20).map(e => {
      const f = FORFAITS.find(x => x.id === e.f);
      return `<div class="row"><div><b>${num(e.n)}</b> ${f ? f.nom : e.f}<div class="mut">${new Date(e.abandonLe).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}${e.client ? ' · ' + esc(e.client) : ''}</div></div><div>${fc(e.prix)}</div></div>`;
    }).join('');
    $('prix').innerHTML = FORFAITS.map(f => `<div class="row"><span>${f.nom}</span><input type="number" min="0" step="100" data-prix="${f.id}" value="${prixDe(f)}" style="width:130px;margin:0"></div>`).join('');
  }

  $('forfaits').onclick = e => { const b = e.target.closest('.fo'); if (!b) return; choix = b.dataset.id; dessiner(); };
  // Read the form; returns the plan, ticket code and client, or null with an error message
  function lireForm() {
    if (!choix) { msg('Choisissez d\'abord un forfait.', true); return null; }
    const f = FORFAITS.find(x => x.id === choix);
    const code = $('code').value.toUpperCase().replace(/\s+/g, '');
    if (code && (data.ventes.some(v => v.code === code) || data.attente.some(v => v.code === code))) { msg(code + ' est déjà utilisé.', true); return null; }
    return { f, code, client: $('client').value.trim().slice(0, 80) };
  }
  function viderForm() { $('code').value = ''; $('client').value = ''; choix = null; }
  $('vendre').onclick = () => {
    const x = lireForm(); if (!x) return;
    data.ventes.push({ t: Date.now(), f: x.f.id, prix: prixDe(x.f), code: x.code, client: x.client });
    save(); viderForm(); msg('Vente enregistrée : ' + x.f.nom + ' ' + fc(prixDe(x.f))); dessiner();
  };
  $('facture').onclick = () => {
    const x = lireForm(); if (!x) return;
    const e = { id: Date.now(), n: ++data.num, t: Date.now(), f: x.f.id, prix: prixDe(x.f), code: x.code, client: x.client };
    data.attente.push(e); save(); viderForm(); msg('Facture F-' + String(e.n).padStart(4, '0') + ' en attente : ' + fc(e.prix)); dessiner(); imprimer(e);
  };
  function imprimer(e) {
    const f = FORFAITS.find(x => x.id === e.f);
    const w = window.open('', '_blank'); if (!w) return;
    w.document.write(`<title>Facture</title><body style="font:16px sans-serif;max-width:360px;margin:20px auto"><h2>Caisse WiFi Zone</h2><p><b>Facture F-${String(e.n).padStart(4, '0')}</b><br>${new Date(e.t).toLocaleString('fr-FR')}${e.client ? '<br>Client : ' + esc(e.client) : ''}</p><p>${f.nom} (${f.duree})<br><b>${fc(e.prix)}</b></p><p><i>En attente de paiement</i></p>`);
    w.document.close(); w.focus(); w.print();
  }
  $('attente').onclick = ev => {
    const b = ev.target.closest('button'); if (!b) return;
    const id = b.dataset.enc || b.dataset.imp || b.dataset.abd;
    const e = data.attente.find(x => String(x.id) === id); if (!e) return;
    if (b.dataset.imp) return imprimer(e);
    if (b.dataset.enc) {
      data.attente = data.attente.filter(x => x !== e);
      data.ventes.push({ t: Date.now(), f: e.f, prix: e.prix, code: e.code, client: e.client, fac: e.n });
      save(); msg('Facture F-' + String(e.n).padStart(4, '0') + ' encaissée : ' + fc(e.prix));
    } else {
      if (!confirm('Le client ne prend pas le produit ? La facture sera abandonnée.')) return;
      data.attente = data.attente.filter(x => x !== e); data.abandons.push({ ...e, abandonLe: Date.now() });
      save(); msg('Facture abandonnée.');
    }
    dessiner();
  };
  $('tabs').onclick = e => {
    const b = e.target.closest('button'); if (!b) return; periode = b.dataset.p;
    document.querySelectorAll('#tabs button').forEach(x => x.setAttribute('aria-pressed', x === b));
    dessiner();
  };
  $('liste').onclick = e => {
    const b = e.target.closest('[data-del]'); if (!b) return;
    if (!confirm('Annuler cette vente ?')) return;
    data.ventes = data.ventes.filter(v => String(v.t) !== b.dataset.del); save(); dessiner();
  };
  $('prix').onchange = e => {
    const i = e.target.dataset.prix; const v = parseInt(e.target.value, 10);
    if (i && Number.isFinite(v) && v >= 0) { data.prix[i] = v; save(); dessiner(); }
  };
  function telecharger(nom, type, contenu) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([contenu], { type }));
    a.download = nom; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  $('exporter').onclick = () => {
    const l = ['Date;Heure;Forfait;Code;Client;Prix FC'];
    for (const v of depuis(periode).reverse()) {
      const d = new Date(v.t), f = FORFAITS.find(x => x.id === v.f);
      l.push([d.toLocaleDateString('fr-FR'), d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }), f ? f.nom : v.f, v.code || '', (v.client || '').replace(/;/g, ','), v.prix].join(';'));
    }
    telecharger('ventes-' + periode + '.csv', 'text/csv;charset=utf-8', '﻿' + l.join('\r\n'));
  };
  $('sauver').onclick = () => telecharger('sauvegarde-caisse-' + new Date().toISOString().slice(0, 10) + '.json', 'application/json', JSON.stringify(data));
  $('restaurer').onclick = () => $('fichier').click();
  $('fichier').onchange = async e => {
    try {
      const d = JSON.parse(await e.target.files[0].text());
      if (!Array.isArray(d.ventes)) throw 0;
      if (!confirm('Remplacer les données actuelles par la sauvegarde ?')) return;
      data = { prix: d.prix || {}, ventes: d.ventes, attente: d.attente || [], abandons: d.abandons || [], num: d.num || 0 }; save(); dessiner(); msg('Sauvegarde restaurée.');
    } catch (err) { msg('Fichier de sauvegarde invalide.', true); }
    e.target.value = '';
  };
  dessiner();

  // ---------- PIN ----------
  // The PIN is a local lock for the device: stored as a salted hash, not real server-side security
  const CLE_PIN = 'caisse-simple-pin';
  let pinSauve = null, essais = 0, bloqueJusque = 0, modePin = 'saisie', ancienOk = false, dernierPin = '';
  try { pinSauve = JSON.parse(localStorage.getItem(CLE_PIN) || 'null'); } catch (e) {}
  async function hacher(pin, sel) {
    const texte = sel + ':' + pin;
    if (window.crypto && crypto.subtle) {
      const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(texte));
      return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join('');
    }
    let x = 5381; for (let i = 0; i < texte.length; i++) x = ((x << 5) + x + texte.charCodeAt(i)) >>> 0; // fallback when crypto.subtle is unavailable (http)
    return 'f' + x;
  }
  function ecranPin(mode, titre) {
    modePin = mode; $('lockTitre').textContent = titre;
    $('pin1').value = ''; $('pin2').value = ''; $('pin2').hidden = mode !== 'creer'; $('lockMsg').textContent = '';
    $('lock').hidden = false; setTimeout(() => $('pin1').focus(), 50);
  }
  // The sales form is open to sellers; everything else is behind the manager PIN
  function verrouiller() { $('lock').hidden = true; $('gerant').hidden = true; $('ouvrirGerant').hidden = false; ancienOk = false; }
  function ouvrirGerant() { $('lock').hidden = true; $('gerant').hidden = false; $('ouvrirGerant').hidden = true; dessiner(); }
  function demanderPin() {
    if (!pinSauve) return ecranPin('creer', 'Première fois : le gérant choisit son code PIN (4 à 8 chiffres).');
    ecranPin('saisie', 'Code PIN du gérant.');
  }
  async function validerPin() {
    const a = $('pin1').value, err = t => { $('lockMsg').textContent = t; $('pin1').value = ''; $('pin2').value = ''; };
    if (Date.now() < bloqueJusque) return err('Trop d\'essais. Patientez ' + Math.ceil((bloqueJusque - Date.now()) / 1000) + ' s.');
    if (modePin === 'creer') {
      if (!/^\d{4,8}$/.test(a)) return err('Le PIN doit avoir 4 à 8 chiffres.');
      if (a !== $('pin2').value) return err('Les deux PIN sont différents.');
      const sel = Math.random().toString(36).slice(2);
      pinSauve = { sel, h: await hacher(a, sel) };
      try { localStorage.setItem(CLE_PIN, JSON.stringify(pinSauve)); } catch (e) {}
      ouvrirGerant(); if (ancienOk) msg('PIN changé.'); ancienOk = false; return;
    }
    if (await hacher(a, pinSauve.sel) !== pinSauve.h) {
      if (++essais >= 5) { essais = 0; bloqueJusque = Date.now() + 30e3; return err('Trop d\'essais. Patientez 30 s.'); }
      return err('PIN incorrect.');
    }
    essais = 0;
    if (modePin === 'ancien') { ancienOk = true; return ecranPin('creer', 'Choisissez le nouveau PIN.'); }
    ouvrirGerant();
  }
  $('lockOk').onclick = validerPin;
  $('lock').onkeydown = e => { if (e.key === 'Enter') validerPin(); };
  $('verrouiller').onclick = verrouiller;
  $('ouvrirGerant').onclick = demanderPin;
  $('lockAnnuler').onclick = verrouiller;
  $('changerPin').onclick = () => ecranPin('ancien', 'Entrez le PIN actuel.');
  let veille; const reveil = () => { clearTimeout(veille); veille = setTimeout(verrouiller, 5 * 60e3); }; // auto-lock after 5 min idle
  ['click', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, reveil, true));
  reveil(); verrouiller();
})();
</script>
</body>
</html>
