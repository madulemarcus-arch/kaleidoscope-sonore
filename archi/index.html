<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12365d">
<title>Archi 2D — plans d'architecture</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header id="top">
  <div class="brand"><img src="icons/logo.svg" alt="" width="26" height="26"><b>Archi 2D</b><input id="docName" aria-label="Nom du plan" value="Sans titre"></div>
  <div class="grp" id="modes" role="group" aria-label="Mode"><button id="mode2" aria-pressed="true" title="Dessin 2D (2)">2D</button><button id="mode3" aria-pressed="false" title="Vue 3D (3)">3D</button><button id="mode4" aria-pressed="false" title="Plans de ferraillage (4)">Ferraillage</button></div>
  <div class="grp" id="tools2d">
    <button id="undo" title="Annuler (Ctrl+Z)" aria-label="Annuler">↶</button>
    <button id="redo" title="Rétablir (Ctrl+Y)" aria-label="Rétablir">↷</button>
    <button id="tGrid" class="tog" aria-pressed="true" title="Grille magnétique (G)">Grille</button>
    <button id="tSnap" class="tog" aria-pressed="true" title="Accrochage aux points (S)">Points</button>
    <button id="tOrtho" class="tog" aria-pressed="false" title="Orthogonal (O, ou maintenir Maj)">Ortho</button>
    <button id="fit" title="Tout voir (H)">Tout voir</button>
    <select id="furnSel" hidden aria-label="Type de meuble" title="Type de meuble"></select>
    <button id="lenBtn" hidden title="Saisir une longueur ou 4x3">Longueur…</button>
    <button id="panelBtn" class="only-small" aria-pressed="false">Calques</button>
  </div>
  <div class="grp"><button id="menuBtn" aria-haspopup="true" aria-expanded="false">Fichier ▾</button></div>
  <div id="menu" hidden>
    <button data-act="new">Nouveau plan</button>
    <button data-act="open">Ouvrir un plan (.json)…</button>
    <button data-act="save">Enregistrer (.json)</button>
    <button data-act="dxf">Exporter en DXF (AutoCAD, mm)</button>
    <button data-act="png">Exporter en image PNG (plan)</button>
  </div>
  <input id="file" type="file" accept=".json,application/json" hidden>
</header>
<main>
  <nav id="tools" aria-label="Outils"></nav>
  <div id="stage"><canvas id="cv" aria-label="Zone de dessin"></canvas><canvas id="cv3" aria-label="Vue 3D" hidden></canvas>
    <div id="bar3" hidden><button data-v="iso">Isométrique</button><button data-v="top">Dessus</button><button data-v="front">Face</button><button data-v="png">Image HD</button><button data-v="panel" class="only-small">Rendu</button></div>
    <p id="msg3" hidden></p>
    <div id="fer" hidden><nav id="ferList" aria-label="Éléments"></nav><div id="ferMain"></div></div></div>
  <aside id="panel">
    <section><h2>Calques</h2><div id="layers"></div><button id="addLayer" class="wide">+ Nouveau calque</button></section>
    <section id="structSec"><h2>Structure (BAEL)</h2><div id="structBox"></div></section>
    <section><h2 id="propsTitle">Propriétés</h2><div id="props"></div></section>
  </aside>
  <aside id="panel3" aria-label="Réglages du rendu"></aside>
</main>
<footer id="status"><span id="hint"></span><span id="coords"></span></footer>
<script src="js/core.js"></script>
<script src="js/draw.js"></script>
<script src="js/struct.js"></script>
<script src="js/rebar.js"></script>
<script src="js/tools.js"></script>
<script src="js/mesh.js"></script>
<script src="js/view3d.js"></script>
<script src="js/io.js"></script>
<script src="js/main.js"></script>
</body>
</html>
